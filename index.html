<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA 1 -->
    <section id="inicio" class="container text-center py-5">

        <h1 class="mb-4">Calculadora de IMC</h1>

        <img
            src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=600"
            class="img-fluid rounded shadow"
            width="500"
        >

        <h4 class="mt-4">Desenvolvido por: Sophia Carlino</h4>

        <p class="mt-3">
            Aplicativo para cálculo do IMC e exibição de dicas
            nutricionais e atividades físicas.
        </p>

        <button class="btn btn-primary btn-lg mt-3"
            onclick="MostrarCalculo()">
            Calcular IMC
        </button>

    </section>

    <!-- TELA 2 -->
    <section id="calculo" class="container py-5 d-none">

        <h2 class="text-center mb-4">Cálculo do IMC</h2>

        <div class="card p-4 shadow">

            <label class="form-label">Peso (kg)</label>
            <input
                type="number"
                id="peso"
                class="form-control mb-3"
                placeholder="Ex: 80"
            >

            <label class="form-label">Altura (m)</label>
            <input
                type="number"
                id="altura"
                class="form-control mb-3"
                placeholder="Ex: 1.75"
                step="0.01"
            >

            <button
                class="btn btn-success"
                onclick="calcularIMC()">
                Calcular
            </button>

            <div class="mt-4 text-center">

                <h4 id="resultado"></h4>

                <h3 id="classificacao"></h3>

            </div>

            <button
                id="btnRecomendacao"
                class="btn btn-warning mt-3 d-none"
                onclick="mostrarRecomendacoes()">
                Ver Recomendações
            </button>

        </div>

    </section>

    <!-- TELA 3 -->
    <section id="recomendacoes"
        class="container py-5 d-none">

        <h2 class="text-center mb-4">
            Recomendações
        </h2>

        <div class="card p-4 shadow">

            <h4>Dicas Nutricionais</h4>
            <ul id="nutricao"></ul>

            <h4 class="mt-4">Atividades Físicas</h4>
            <ul id="atividades"></ul>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
